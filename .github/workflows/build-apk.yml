name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/linyappcraft/**', '.github/workflows/build-apk.yml']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/linyappcraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build web bundle (Capacitor base)
        run: CAP=1 npx vite build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: app/linyappcraft/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: linydory-debug-apk
          path: app/linyappcraft/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
